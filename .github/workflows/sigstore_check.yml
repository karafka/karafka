name: Sigstore Check

# Builds the gem and signs it the way the push workflows do, then verifies the attestation,
# without pushing anything, so a broken signer shows up before a release

on:
  schedule:
    - cron: '0 3 * * *'
  pull_request:
    branches: [ master ]
    paths:
      - '.github/release/**'
      - '.github/workflows/sigstore_check.yml'
      - '.github/workflows/push_*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sign:
    # Signing needs the OIDC token, which forks do not get
    if: >-
      github.repository_owner == 'karafka' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          bundler-cache: false

      - name: Build, sign and verify the gem
        run: |
          gem build *.gemspec
          gem_file=$(ls *.gem)

          .github/release/sigstore.sh sign "$gem_file" --bundle "$gem_file.sigstore.json"
          .github/release/sigstore.sh verify "$gem_file" --bundle "$gem_file.sigstore.json" \
            --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
