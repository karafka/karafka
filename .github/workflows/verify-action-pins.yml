name: Verify Action Pins
on:
  pull_request:
    paths:
      - '.github/workflows/**'
jobs:
  verify_action_pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check SHA pins
        run: |
          # Every remote action must be pinned to a full 40-character commit SHA. Local actions
          # (./) and docker:// images are not checked.
          unpinned=$(grep -E -rn --include="*.yml" --include="*.yaml" \
            "^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]*['\"]?[^.'\"[:space:]]" .github/workflows/ \
            | grep -Ev "uses:[[:space:]]*['\"]?docker://" \
            | grep -Ev "@[0-9a-f]{40}['\"]?([[:space:]]|$)" || true)
          if [ -n "$unpinned" ]; then
            echo "$unpinned"
            echo "::error::Actions should use SHA pins, not tags or branch names"
            exit 1
          fi
